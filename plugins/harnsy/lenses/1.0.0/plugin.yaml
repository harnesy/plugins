# Lenses: a recording of the project's items read through several lenses.
# A lens is a name and an instruction. An analysis transcribes the recording
# (harnsy.transcribe.*), then gives a role of the project one item that
# links the transcript and lists the chosen lenses; the role's agent writes
# lenses.md and submits the item. The transcript's text never goes into it.
name: lenses
version: 1.0.0
title: Lenses
needs: [items.read, items.write, transcribe, sql]
settings:
  - {key: role, type: string, default: "", label: "Role that gets the analyses (empty: the project's lead)"}
entries:
  - {name: lenses, kind: page, title: page.title, icon: layers, script: web/page.js, source: lua/lenses.lua, calls: [lens_list, lens_save, lens_delete, node_ready, recordings, analyze, analyses], place: project}
  - {name: loop, kind: process, source: lua/lenses.lua}
listing:
  summary: "Lenses for a recording: a meeting or a call read by the instructions you write, by an agent of the project."
  description: |
    A lens is a name and an instruction, like Meeting summary or Decisions and tasks. Pick a sound or video
    attachment of an item, tick the lenses, press Analyze. The plugin has harnsy transcribe it, which sends the
    recording to the node's dictation connection, then gives one item to a role of the project (its lead when
    the setting is empty) with a link to the transcript and the lenses. The role's agent writes lenses.md and submits it.
  docs:
    - {slug: how-it-works, title: How it works and what it asks for, file: listing/docs/how-it-works.md}
